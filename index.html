<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- FONTS -->
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;900&display=swap"
      rel="stylesheet"
    />
    <!-- NAVBAR -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css"
    />
    <!-- SOCIAL ICONS  -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"
      integrity="sha512-KfkfwYDsLkIlwQp6LFnl8zNdLGxu9YAA1QvwINks4PhcElQSvqcyVLLD9aMhXd13uQjoXtEKNosOWaZqXgel0g=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./style.css" />
    <link rel="icon" href="./imgs/logo.png" type="image/png" />
    <meta name="description" content="Tic Tac Toe for two players in the browser: take turns placing X and O, three in a row wins." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tic Tac Toe" />
    <meta property="og:description" content="Tic Tac Toe for two players in the browser: take turns placing X and O, three in a row wins." />
    <meta property="og:url" content="https://tictactoe-by-ivan-kuper.netlify.app/" />
    <meta property="og:image" content="https://tictactoe-by-ivan-kuper.netlify.app/og.jpg" />
    <meta name="theme-color" content="#212529" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>TIC TAC TOE</title>
  </head>
  <body class="d-flex flex-column min-vh-100">
    <!-- NavBar -->
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="index.html"
          ><img class="logo" src="imgs/logo.png" alt="" width="32" height="32" />
          <span class="logoSpan">TIC TAC TOE</span></a
        >
        <a class="portfolio-link" href="https://ivankuper.github.io/"
          ><span class="d-none d-sm-inline">Ivan Kuper &middot; </span>Portfolio
          <img class="profilePic" src="imgs/Profile.jpg" alt="" width="40" height="40"
        /></a>
      </div>
    </nav>
    <!-- End of Navbar -->
    <main>
      <h1 class="visually-hidden">Tic Tac Toe</h1>
      <div class="panel">
        <p class="status" id="status" aria-live="polite">X's turn</p>
        <div class="board" id="board">
          <button type="button" class="cell" data-cell aria-label="Row 1, column 1, empty"></button>
          <button type="button" class="cell" data-cell aria-label="Row 1, column 2, empty"></button>
          <button type="button" class="cell" data-cell aria-label="Row 1, column 3, empty"></button>
          <button type="button" class="cell" data-cell aria-label="Row 2, column 1, empty"></button>
          <button type="button" class="cell" data-cell aria-label="Row 2, column 2, empty"></button>
          <button type="button" class="cell" data-cell aria-label="Row 2, column 3, empty"></button>
          <button type="button" class="cell" data-cell aria-label="Row 3, column 1, empty"></button>
          <button type="button" class="cell" data-cell aria-label="Row 3, column 2, empty"></button>
          <button type="button" class="cell" data-cell aria-label="Row 3, column 3, empty"></button>
        </div>
        <div class="scores" aria-label="Score">
          <span>X <strong id="scoreX">0</strong></span>
          <span>Draws <strong id="scoreD">0</strong></span>
          <span>O <strong id="scoreO">0</strong></span>
        </div>
        <button type="button" id="newBtn" class="again">New game</button>
        <p class="hint">Two players take turns. Tap a square, or use Tab and Enter. Three in a row wins.</p>
      </div>
      <div class="winning-message" id="winningMessage" role="dialog" aria-modal="true" aria-label="Game result">
        <div data-winning-message-text></div>
        <button id="restartButton" type="button">Play again</button>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer mt-auto pt-3">
      <p class="copyright">
        Coded & Designed By:
        <strong
          ><a href="https://ivankuper.github.io/" target="_blank"
            >Ivan Kuper</a
          ></strong
        >
        © All rights reserved.
      </p>
      <div class="socials">
        <a aria-label="GitHub" class="link" target="_blank" rel="noopener" href="https://github.com/IvanKuper"
          ><i class="fa-brands fa-github fa-2x px-1"></i
        ></a>
        <a aria-label="LinkedIn" class="link" target="_blank" rel="noopener" href="https://www.linkedin.com/in/ivankuper/"
          ><i class="fa-brands fa-linkedin fa-2x px-1"></i
        ></a>
      </div>
    </footer>
    <!-- End  Footer -->
    <script src="./app.js" defer></script>
  </body>
</html>
